# Target class for this configuration
_target_: verl.workers.config.FSDPOptimizerConfig

# Optimizer choices:
#   AdamW
#   SingleDeviceMuonWithAuxAdam
#   SingleDeviceMemoryMuonWithAuxAdam
optimizer: AdamW

# Module path to import optimizer from.
# For repo-local Muon / Memory-Muon optimizers, this field is ignored.
# Examples for non-Muon optimizers: torch.optim, torchao.optim, bitsandbytes.optim
optimizer_impl: torch.optim

# Base learning rate.
# - AdamW: applied directly.
# - Muon / Memory-Muon: used by the auxiliary Adam branch unless `adam_aux_lr` overrides it.
lr: 1e-5

# Optional: auxiliary Adam LR for Muon / Memory-Muon only.
# If null, the top-level `lr` is reused so the Adam side stays aligned with AdamW.
adam_aux_lr: null

# LR warmup steps ratio
lr_warmup_steps_ratio: 0.0

# Total training steps
total_training_steps: -1

# Weight decay shared across AdamW, Muon branch, and auxiliary Adam branch.
weight_decay: 0.01

# LR warmup steps
lr_warmup_steps: -1

# Betas for Adam optimizer / auxiliary Adam branch
betas: [0.9, 0.999]

# Clip gradient
clip_grad: 1.0

# Minimum LR ratio for cosine schedule
min_lr_ratio: 0.0

# Number of cosine cycles in LR schedule
num_cycles: 0.5

# LR scheduler type: constant or cosine
lr_scheduler_type: constant

# deprecated
warmup_style: null

# Additional optimizer-specific keyword arguments
# Example for torchao with bf16 stochastic rounding:
# optimizer_impl: torchao.optim
# optimizer: _AdamW
# override_optimizer_config:
#   bf16_stochastic_round: true
override_optimizer_config: null

# Muon branch settings for Muon / Memory-Muon aux+Adam optimizers.
muon_lr: 0.002
muon_momentum: 0.95
muon_nesterov: true
muon_ns_steps: 5
muon_exclude_name_substrings: [embed, lm_head, wte, vision]
adam_aux_eps: 1e-10

# Memory-Muon-only settings.
memory_num_centroids: 16
memory_centroid_dim: 1024
memory_lambda: 0.01
memory_init_seed: null
memory_ema_decay: 0.99
memory_ema_eps: 1e-8
memory_step_update: 64
memory_ema_ws_steps: 512
